name: profile-render

# 公开仓 main 轨：只做占位符渲染与合规校验，不注入任何 Secrets 真值、不做部署。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # 公开仓不得配置真值，全部走 PLACEHOLDER_ 兜底
  STATS_REPO:   ${{ vars.STATS_REPO   || 'PLACEHOLDER_REPO' }}
  STATS_OWNER:  ${{ vars.STATS_OWNER  || 'PLACEHOLDER_OWNER' }}
  SITE_TITLE:   ${{ vars.SITE_TITLE   || 'PLACEHOLDER_TITLE' }}

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Desensitize scan
        run: |
          echo "== 扫描疑似凭证 / IP / 域名 =="
          python3 - <<'PY'
          import os, re, sys
          pats = [
              ('private-key', re.compile(r'-----BEGIN [A-Z ]*PRIVATE KEY-----')),
              ('token', re.compile(r'\b(ghp_|github_pat_|sk-)[A-Za-z0-9_]{16,}')),
              ('ipv4', re.compile(r'\b(?:\d{1,3}\.){3}\d{1,3}\b')),
              ('email', re.compile(r'\b[\w.+-]+@[\w-]+\.[\w.]+\b')),
          ]
          skip = {'.git', 'node_modules', '.venv'}
          hits = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in skip]
              for name in files:
                  p = os.path.join(root, name)
                  try:
                      text = open(p, encoding='utf-8', errors='ignore').read()
                  except OSError:
                      continue
                  for i, line in enumerate(text.splitlines(), 1):
                      for label, pat in pats:
                          if pat.search(line):
                              hits.append('%s:%d [%s]' % (p, i, label))
          if hits:
              for h in hits:
                  print('::error::' + h)
              print('FAIL: 公开仓出现 %d 处疑似敏感信息' % len(hits))
              sys.exit(1)
          print('PASS: 未发现凭证 / IP / 邮箱')
          PY

      - name: Check profile markers
        run: |
          grep -q '<!-- PROFILE:START -->' README.md || { echo "::error::缺少 PROFILE:START 标记"; exit 1; }
          grep -q '<!-- PROFILE:END -->'   README.md || { echo "::error::缺少 PROFILE:END 标记"; exit 1; }
          echo "PASS: 自动区块标记完整"

      - name: Placeholder audit
        run: |
          echo "== 公开轨变量取值（应为 PLACEHOLDER_*） =="
          for v in STATS_REPO STATS_OWNER SITE_TITLE; do
            printf '%-14s = %s\n' "$v" "${!v}"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: readme-snapshot
          path: README.md
          if-no-files-found: ignore
